<title>支付規範問答</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 版面:單欄閱讀,上方提問、下方答案與來源段落,環境檢測收在頁尾 */
:root {
  --bg: #f6f7f5; --surface: #ffffff; --fg: #1d2623; --muted: #5d6a66; --line: #d9dfdc;
  --accent: #0f6b5c; --accent-fg: #ffffff; --accent-soft: #e2f0ec; --warn: #9a5b00; --warn-soft: #fbefd9; --bad: #a8321f;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141917; --surface: #1c2320; --fg: #e6ece9; --muted: #98a6a1; --line: #2d3733;
  --accent: #4fc2ab; --accent-fg: #0a1512; --accent-soft: #1f322d; --warn: #e3b25c; --warn-soft: #33290f; --bad: #ef8a76; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141917; --surface: #1c2320; --fg: #e6ece9; --muted: #98a6a1; --line: #2d3733;
  --accent: #4fc2ab; --accent-fg: #0a1512; --accent-soft: #1f322d; --warn: #e3b25c; --warn-soft: #33290f; --bad: #ef8a76; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.7 var(--font-body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 48px; }
main { max-width: 760px; margin: 0 auto; display: grid; gap: 20px; }
h1 { font-size: 22px; line-height: 1.3; margin: 0; text-wrap: balance; }
h2 { font-size: 13px; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; font-weight: 500; }
.sub { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
textarea { width: 100%; min-height: 84px; resize: vertical; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
textarea:focus-visible, button:focus-visible, summary:focus-visible, .seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.grow { flex: 1 1 auto; }
button { font: inherit; font-weight: 500; border-radius: 6px; padding: 8px 16px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { padding: 6px 12px; font-size: 13px; cursor: pointer; background: var(--surface); }
.seg input:checked + label { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.examples { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.examples button { font-size: 13px; padding: 4px 10px; color: var(--muted); }
.status { font-size: 13px; color: var(--muted); font-family: var(--font-mono); }
.answer { white-space: pre-wrap; overflow-wrap: anywhere; }
.cite { font-family: var(--font-mono); font-size: 12px; background: var(--accent-soft); color: var(--accent); border: 0; border-radius: 4px; padding: 0 5px; cursor: pointer; vertical-align: 1px; }
.notice { background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 8px 12px; font-size: 13px; }
.err { color: var(--bad); }
.trace { font-family: var(--font-mono); font-size: 12px; color: var(--muted); display: grid; gap: 2px; }
.trace b { color: var(--fg); font-weight: 500; }
.src { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
.src:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
.src-h { font-size: 13px; color: var(--muted); }
.src-h strong { color: var(--fg); font-family: var(--font-mono); font-weight: 500; }
.src pre { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.6 var(--font-body); }
.src.flash { background: var(--accent-soft); border-radius: 6px; padding: 8px; }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.checks { display: grid; gap: 6px; margin-top: 10px; font-size: 13px; }
.checks div { display: grid; grid-template-columns: 4.5em 1fr; gap: 8px; }
.ok { color: var(--accent); font-weight: 700; } .no { color: var(--bad); font-weight: 700; } .na { color: var(--warn); font-weight: 700; }
[hidden] { display: none !important; }
</style>

<main>
  <header>
    <h1>法定傳染病醫療服務費用支付作業規範 問答</h1>
    <p class="sub">依據 114 年 10 月 1 日生效版本,共 <span id="meta-pages"></span> 頁、<span id="meta-chunks"></span> 個段落。答案僅根據規範內容,請以原文為準。</p>
  </header>

  <section class="card" aria-label="提問">
    <h2>提問</h2>
    <textarea id="q" placeholder="例如:山地鄉結核菌快速分子檢測沒有上傳資料,可以申報嗎?"></textarea>
    <div class="examples" id="examples"></div>
    <div class="row">
      <div class="seg" role="radiogroup" aria-label="檢索方式">
        <input type="radio" name="mode" id="m-tool" value="tool" checked><label for="m-tool">Claude 自行搜尋</label>
        <input type="radio" name="mode" id="m-page" value="page"><label for="m-page">頁面先檢索</label>
      </div>
      <span class="grow"></span>
      <button id="stop" hidden>停止</button>
      <button id="ask" class="primary">送出</button>
    </div>
  </section>

  <section class="card" id="out" hidden aria-live="polite">
    <h2>回答</h2>
    <div class="status" id="status"></div>
    <div class="answer" id="answer"></div>
    <div class="notice" id="note" hidden></div>
    <details id="trace-wrap" hidden style="margin-top:12px"><summary>檢索過程</summary><div class="trace" id="trace" style="margin-top:8px"></div></details>
  </section>

  <section class="card" id="srcs-card" hidden>
    <h2>引用段落</h2>
    <div id="srcs"></div>
  </section>

  <section class="card">
    <details id="env">
      <summary>環境檢測(驗證用)</summary>
      <div class="row"><button id="run-env">執行檢測</button></div>
      <div class="checks" id="checks"></div>
    </details>
  </section>
</main>

<script type="application/json" id="data">__DATA__</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const CH = DATA.chunks;
  const $ = (id) => document.getElementById(id);
  $('meta-pages').textContent = DATA.pageCount;
  $('meta-chunks').textContent = CH.length;

  /* ---------- BM25(中文 bigram + 英數代碼) ---------- */
  const tokenize = (s) => {
    const out = [];
    const lower = s.toLowerCase();
    for (const m of lower.matchAll(/[a-z0-9]+/g)) out.push(m[0]);
    for (const m of lower.matchAll(/[㐀-鿿]+/g)) {
      const w = m[0];
      if (w.length === 1) out.push(w);
      for (let i = 0; i < w.length - 1; i++) out.push(w.slice(i, i + 2));
    }
    return out;
  };
  const docs = CH.map((c) => tokenize((c.heading || '') + ' ' + c.text));
  const df = new Map(); let totalLen = 0;
  docs.forEach((d) => { totalLen += d.length; for (const t of new Set(d)) df.set(t, (df.get(t) || 0) + 1); });
  const avgLen = totalLen / docs.length;
  const tfs = docs.map((d) => { const m = new Map(); d.forEach((t) => m.set(t, (m.get(t) || 0) + 1)); return m; });
  function search(query, limit = 8) {
    const qt = [...new Set(tokenize(query))];
    const N = CH.length, k1 = 1.4, b = 0.75;
    const scored = [];
    for (let i = 0; i < N; i++) {
      let s = 0;
      for (const t of qt) {
        const f = tfs[i].get(t); if (!f) continue;
        const n = df.get(t);
        s += Math.log(1 + (N - n + 0.5) / (n + 0.5)) * (f * (k1 + 1)) / (f + k1 * (1 - b + b * docs[i].length / avgLen));
      }
      if (s > 0) scored.push([i, s]);
    }
    scored.sort((a, b) => b[1] - a[1]);
    return scored.slice(0, limit).map(([i, s]) => ({ id: i, score: +s.toFixed(2) }));
  }
  const fmt = (c) => `[#${c.id}] 第${c.page}${c.endPage !== c.page ? '–' + c.endPage : ''}頁 ${c.heading || ''}\n${c.text}`;

  /* ---------- UI ---------- */
  const EXAMPLES = [
    '山地鄉結核菌快速分子檢測沒有上傳資料,可以申報嗎?',
    '診斷結果編碼資料處理費的醫令代碼是什麼?',
    '委託其他實驗室代檢時,由誰申報?',
    '同一民眾同一項目一年可以申報幾次?',
  ];
  EXAMPLES.forEach((t) => { const b = document.createElement('button'); b.textContent = t; b.onclick = () => { $('q').value = t; $('q').focus(); }; $('examples').append(b); });

  const RULES = `你是衛生福利部「法定傳染病醫療服務費用支付作業規範」的問答助理。請用繁體中文回答。
規則:
1. 只能根據規範原文回答,不可憑記憶補充。找不到依據時,直接說「規範中找不到相關規定」。
2. 每個論點後面標註來源段落編號,格式為 [#12],可連續標註 [#12][#15]。
3. 涉及代碼、金額、次數、期限時,逐字照原文,不要改寫數字。
4. 回答精簡,先給結論,再列條件或例外。`;

  let ctl = null;
  const sources = new Map();
  function renderAnswer(text) {
    const box = $('answer'); box.textContent = '';
    const parts = text.split(/(\[#\d+\])/g);
    for (const p of parts) {
      const m = p.match(/^\[#(\d+)\]$/);
      if (m && CH[+m[1]]) {
        const b = document.createElement('button'); b.className = 'cite'; b.textContent = '#' + m[1];
        b.title = `第${CH[+m[1]].page}頁`; b.onclick = () => jump(+m[1]); box.append(b);
        sources.set(+m[1], true);
      } else box.append(document.createTextNode(p));
    }
  }
  function renderSources() {
    const wrap = $('srcs'); wrap.textContent = '';
    const ids = [...sources.keys()].sort((a, b) => a - b);
    $('srcs-card').hidden = !ids.length;
    ids.forEach((id) => {
      const c = CH[id]; const d = document.createElement('div'); d.className = 'src'; d.id = 'src-' + id;
      const h = document.createElement('div'); h.className = 'src-h';
      const s = document.createElement('strong'); s.textContent = '#' + id;
      h.append(s, ` 第${c.page}${c.endPage !== c.page ? '–' + c.endPage : ''}頁 ${c.heading || ''}`);
      const pre = document.createElement('pre'); pre.textContent = c.text;
      d.append(h, pre); wrap.append(d);
    });
  }
  function jump(id) {
    const el = $('src-' + id); if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1400);
  }
  const ERR = {
    not_granted: '尚未允許此頁面使用 Claude,請重新整理後在提示中選擇允許。',
    rate_limited: '呼叫太頻繁或已達使用上限,請稍後再試。',
    session_expired: '登入已過期,請重新登入 claude.ai。',
    prompt_too_large: '送出的內容超過長度上限。',
    refused: 'Claude 拒絕回答這個問題,請換個問法。',
    empty_completion: '沒有產生回答,請簡化問題後再試。',
    upstream_error: '連線中斷,請再試一次。',
    sampling_disabled: '此帳號或組織未開放 Claude 功能。',
    tools_unavailable: '此環境不支援工具呼叫,請改用「頁面先檢索」。',
  };

  async function ask() {
    const q = $('q').value.trim(); if (!q) return;
    const sample = await window.claude?.use('sample');
    $('out').hidden = false; $('answer').textContent = ''; $('note').hidden = true; $('trace').textContent = ''; $('trace-wrap').hidden = true; $('srcs-card').hidden = true; sources.clear();
    if (!sample) { $('status').textContent = ''; $('answer').textContent = '此頁面必須在 claude.ai 內開啟才能提問。'; return; }
    const mode = document.querySelector('input[name=mode]:checked').value;
    ctl = new AbortController(); $('ask').disabled = true; $('stop').hidden = false;
    const t0 = performance.now(); let rounds = 0;
    const log = (html) => { const d = document.createElement('div'); d.innerHTML = html; $('trace').append(d); $('trace-wrap').hidden = false; };
    const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    const tick = setInterval(() => { $('status').textContent = `思考中… ${((performance.now() - t0) / 1000).toFixed(0)} 秒`; }, 500);
    $('status').textContent = '思考中…';
    try {
      let input, options = { signal: ctl.signal, cache: false, onText: ({ text }) => { renderAnswer(text); } };
      if (mode === 'page') {
        const hits = search(q, 6);
        log(`<b>頁面檢索</b> 命中 ${hits.map((h) => '#' + h.id + '(' + h.score + ')').join(' ')}`);
        const ctx = hits.map((h) => fmt(CH[h.id])).join('\n\n---\n\n');
        input = `${RULES}\n\n【規範段落】\n${ctx}\n\n【問題】\n${q}`;
        delete options.cache; options.cache = false;
      } else {
        input = `${RULES}\n5. 你沒有規範全文。請先用 search 工具搜尋(可換不同關鍵字多搜幾次,中文用規範慣用詞),再用 read 工具讀取最相關的段落,確認後才作答。\n\n【問題】\n${q}`;
        options.tools = [
          { name: 'search', description: '用關鍵字搜尋規範段落,回傳最相關的最多 8 筆,每筆含段落編號、頁碼、標題與開頭預覽。關鍵字請用規範常用詞,例如「山地鄉」「醫令代碼」「申報」。',
            inputSchema: { type: 'object', properties: { query: { type: 'string', description: '搜尋關鍵字,空白分隔' } }, required: ['query'] },
            execute: ({ query }) => { rounds++; const hits = search(String(query), 8); log(`<b>search</b> 「${esc(query)}」→ ${hits.map((h) => '#' + h.id).join(' ') || '無結果'}`);
              return hits.map((h) => { const c = CH[h.id]; return `#${c.id} 第${c.page}頁 ${c.heading || ''} | ${c.text.replace(/\n/g, ' ').slice(0, 70)}`; }).join('\n') || '沒有符合的段落'; } },
          { name: 'read', description: '讀取指定編號段落的完整原文(一次最多 6 個)。同時可帶前後相鄰段落以補足上下文。',
            inputSchema: { type: 'object', properties: { ids: { type: 'array', items: { type: 'integer' }, description: '段落編號' }, with_neighbors: { type: 'boolean', description: '是否一併帶入前一段與後一段' } }, required: ['ids'] },
            execute: ({ ids, with_neighbors }) => { rounds++; let list = (Array.isArray(ids) ? ids : [ids]).map(Number).filter((n) => CH[n]).slice(0, 6);
              if (with_neighbors) list = [...new Set(list.flatMap((n) => [n - 1, n, n + 1]).filter((n) => CH[n]))].slice(0, 9);
              log(`<b>read</b> ${list.map((n) => '#' + n).join(' ')}`); return list.map((n) => fmt(CH[n])).join('\n\n---\n\n').slice(0, 12000); } },
        ];
        delete options.cache;
      }
      const res = await sample(input, { ...options, modelTier: 'default' });
      renderAnswer(res.text);
      if (res.truncated) { $('note').hidden = false; $('note').textContent = '答案因長度限制被截斷,請縮小問題範圍。'; }
      $('status').textContent = `完成 · ${((performance.now() - t0) / 1000).toFixed(1)} 秒` + (mode === 'tool' ? ` · 工具呼叫 ${rounds} 次` : ' · 單次呼叫') + ` · 實際模型層級 ${res.modelTierApplied}`;
    } catch (e) {
      if (e && e.text) renderAnswer(e.text);
      if (e && e.code === 'cancelled') $('status').textContent = '已停止';
      else { $('status').textContent = ''; $('note').hidden = false; $('note').className = 'notice err'; $('note').textContent = ERR[e && e.code] || ('發生錯誤:' + (e && e.code || e)); }
    } finally {
      clearInterval(tick); $('ask').disabled = false; $('stop').hidden = true; ctl = null; renderSources();
    }
  }
  $('ask').onclick = ask;
  $('stop').onclick = () => ctl && ctl.abort();
  $('q').addEventListener('keydown', (e) => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') ask(); });

  /* ---------- 環境檢測 ---------- */
  $('run-env').onclick = async () => {
    const box = $('checks'); box.textContent = '';
    const add = (state, name, detail) => { const d = document.createElement('div'); const s = document.createElement('span'); s.className = state; s.textContent = state === 'ok' ? '可用' : state === 'no' ? '不可用' : '未確定'; const t = document.createElement('span'); t.textContent = name + (detail ? ' — ' + detail : ''); d.append(s, t); box.append(d); };
    const sample = await window.claude?.use('sample');
    if (!sample) add('no', 'sample(呼叫 Claude)', '回傳 null'); else {
      add('ok', 'sample(呼叫 Claude)');
      try { const l = await sample.limits(); add('ok', '輸入上限', `${l.maxPromptBytes} bytes;工具 ${l.tools ? '最多 ' + l.tools.maxCount + ' 個' : '不支援'};圖片 ${l.images ? '支援' : '未宣告/不支援'};層級 ${(l.modelTiers || []).join('/') || '預設'}`); } catch (e) { add('no', 'limits()', e && e.code); }
    }
    const enc = new TextEncoder().encode(CH.map((c) => c.text).join('\n')).length;
    add(enc < 262144 ? 'ok' : 'no', '全文是否塞得下單次輸入', `全文 ${enc.toLocaleString()} bytes / 上限 262,144 bytes`);
    try { const ctl2 = new AbortController(); const tm = setTimeout(() => ctl2.abort(), 4000);
      await fetch('https://huggingface.co/Xenova/paraphrase-multilingual-MiniLM-L12-v2/resolve/main/config.json', { signal: ctl2.signal, mode: 'no-cors' }); clearTimeout(tm); add('ok', '連線 huggingface.co(嵌入模型來源)');
    } catch (e) { add('no', '連線 huggingface.co(嵌入模型來源)', '被阻擋或逾時,瀏覽器端嵌入模型無法下載'); }
    try { const r = await fetch(location.href, { method: 'HEAD' }); add('ok', 'fetch 同源檔案', 'HTTP ' + r.status); } catch (e) { add('na', 'fetch 同源檔案', '失敗'); }
    add(typeof WebAssembly === 'object' ? 'ok' : 'no', 'WebAssembly');
    try { const u = URL.createObjectURL(new Blob(['postMessage(1)'])); const w = new Worker(u); await new Promise((res, rej) => { w.onmessage = res; w.onerror = rej; setTimeout(rej, 2000); }); w.terminate(); add('ok', 'Web Worker(blob)'); } catch (e) { add('no', 'Web Worker(blob)'); }
    try { await new Promise((res, rej) => { const r = indexedDB.open('poc-test'); r.onsuccess = () => { r.result.close(); indexedDB.deleteDatabase('poc-test'); res(); }; r.onerror = rej; setTimeout(rej, 2000); }); add('ok', 'IndexedDB'); } catch (e) { add('no', 'IndexedDB'); }
  };
})();
</script>
